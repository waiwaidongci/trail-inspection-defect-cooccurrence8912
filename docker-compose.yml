name: hxwl-solo2611-7-1124
x-runtime: &runtime
  DATABASE_URL: 'postgresql+psycopg://analytics:${DB_PASSWORD:-analytics-demo-2611}@db:5432/analytics'
  REDIS_URL: redis://redis:6379/0
  JWT_SECRET: ${JWT_SECRET:-local-demo-hxwl-solo2611-7-1124-signing-2611-only}
  SEED_DEMO: ${SEED_DEMO:-true}
  ARTIFACT_DIR: /artifacts
services:
  frontend:
    build: ./frontend
    container_name: ${COMPOSE_PROJECT_NAME:-hxwl-solo2611-7-1124}-frontend
    ports:
      - '127.0.0.1:${FRONTEND_PORT:-18316}:80'
    depends_on:
      backend: {condition: service_healthy}
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, 'http://127.0.0.1/healthz']
      interval: 3s
      timeout: 3s
      retries: 20
  backend:
    build: ./backend
    image: hxwl-solo2611-7-1124-runtime:local
    container_name: ${COMPOSE_PROJECT_NAME:-hxwl-solo2611-7-1124}-backend
    environment: *runtime
    volumes: [artifacts:/artifacts]
    ports:
      - '127.0.0.1:${BACKEND_PORT:-19316}:8000'
    depends_on:
      db: {condition: service_healthy}
      redis: {condition: service_healthy}
    healthcheck:
      test: [CMD, python, -c, 'import urllib.request; urllib.request.urlopen("http://127.0.0.1:8000/healthz")']
      interval: 3s
      timeout: 3s
      retries: 35
  worker:
    image: hxwl-solo2611-7-1124-runtime:local
    pull_policy: never
    container_name: ${COMPOSE_PROJECT_NAME:-hxwl-solo2611-7-1124}-worker
    command: [python, -m, src.worker]
    environment: *runtime
    volumes: [artifacts:/artifacts]
    depends_on:
      db: {condition: service_healthy}
      redis: {condition: service_healthy}
      backend: {condition: service_healthy}
    healthcheck:
      test: [CMD, python, -c, 'from pathlib import Path; import time; assert time.time()-Path("/tmp/analysis-heartbeat").stat().st_mtime < 30']
      interval: 3s
      timeout: 3s
      retries: 20
  db:
    image: postgres:16-alpine
    container_name: ${COMPOSE_PROJECT_NAME:-hxwl-solo2611-7-1124}-db
    environment:
      POSTGRES_DB: analytics
      POSTGRES_USER: analytics
      POSTGRES_PASSWORD: ${DB_PASSWORD:-analytics-demo-2611}
    ports:
      - '127.0.0.1:${DB_PORT:-17816}:5432'
    volumes: [db-data:/var/lib/postgresql/data]
    healthcheck:
      test: [CMD, pg_isready, -h, 127.0.0.1, -U, analytics, -d, analytics]
      interval: 3s
      timeout: 4s
      retries: 45
  redis:
    image: redis:7-alpine
    container_name: ${COMPOSE_PROJECT_NAME:-hxwl-solo2611-7-1124}-redis
    command: [redis-server, --appendonly, 'yes']
    volumes: [redis-data:/data]
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 3s
      timeout: 3s
      retries: 25
volumes:
  db-data: {}
  redis-data: {}
  artifacts: {}
